<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-Native Lab — Knowledge Graph</title>
<meta property="og:title" content="AI-Native Organizations — Knowledge Graph">
<meta property="og:description" content="Interactive map of AI-Native Organizations S2: sessions, speakers, concepts, timeline.">
<meta property="og:image" content="https://ai-mindset-org.github.io/ainative-lab/graph/speakers/stepan-gershuni.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://unpkg.com/force-graph"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2333;--bg4:#0a0e14;
  --teal:#4dc9d4;--td:rgba(77,201,212,.12);--tg:rgba(77,201,212,.35);
  --blue:#3b82f6;--amber:#f59e0b;--green:#22c55e;--purple:#a78bfa;--red:#ff6b6b;--pink:#ec4899;
  --text:#e6edf3;--t2:rgba(230,237,243,.72);--t3:rgba(230,237,243,.42);
  --brd:rgba(77,201,212,.1);--brd2:rgba(77,201,212,.22);
  --mono:'IBM Plex Mono',monospace;--sans:'Space Grotesk',sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;line-height:1.55;overflow:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(rgba(77,201,212,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(77,201,212,.025) 1px,transparent 1px);
  background-size:60px 60px}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 40%,transparent 0%,rgba(0,0,0,.45) 100%)}

.app{position:relative;z-index:1;display:grid;grid-template-columns:260px 1fr 340px;grid-template-rows:46px 1fr;height:100vh;overflow:hidden}
.app.detail-closed{grid-template-columns:260px 1fr 0}

/* Topbar */
.top{grid-column:1/-1;background:var(--bg2);border-bottom:1px solid var(--brd);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:100}
.dots{display:flex;gap:6px}.dots span{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.dots .r{background:#ff5f57}.dots .y{background:#febc2e}.dots .g{background:#28c840}
.top-title{font-size:11px;color:var(--t3);margin-left:4px}
.top-title b{color:var(--text);font-weight:500}
.top-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.view-toggle{display:flex;background:var(--bg3);border:1px solid var(--brd);border-radius:5px;overflow:hidden}
.view-toggle button{background:transparent;border:none;color:var(--t2);font:10px/1 var(--mono);padding:6px 12px;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;transition:all .15s}
.view-toggle button:hover{color:var(--text)}
.view-toggle button.on{background:var(--td);color:var(--teal)}
.top-badge{font-size:9px;padding:3px 8px;border-radius:3px;background:var(--td);color:var(--teal);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--brd2)}
.top-search{padding:5px 10px;background:var(--bg3);border:1px solid var(--brd);border-radius:4px;color:var(--text);font:11px var(--mono);width:200px;outline:none}
.top-search:focus{border-color:var(--teal)}
.top-search::placeholder{color:var(--t3)}

/* Sidebar */
.side{background:var(--bg2);border-right:1px solid var(--brd);overflow-y:auto;padding:14px 0}
.side::-webkit-scrollbar{width:4px}.side::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:2px}
.sh{font-size:9px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--t3);padding:14px 16px 6px}
.si{display:flex;align-items:center;gap:8px;padding:6px 16px;cursor:pointer;font-size:11px;color:var(--t2);border-left:2px solid transparent;transition:all .12s;user-select:none}
.si:hover{background:rgba(77,201,212,.05);color:var(--text)}
.si.on{background:rgba(77,201,212,.09);color:var(--teal);border-left-color:var(--teal)}
.si .chk{width:10px;height:10px;border:1px solid var(--brd2);border-radius:2px;flex-shrink:0;display:grid;place-items:center}
.si.on .chk{background:var(--teal);border-color:var(--teal)}
.si.on .chk::after{content:'';width:4px;height:7px;border:solid var(--bg);border-width:0 1.5px 1.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.si .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.si .tag{font-size:9px;color:var(--t3);margin-left:auto}
.legend{padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;font-size:9px;color:var(--t3)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}

/* Graph area */
.graph-area{position:relative;overflow:hidden;background:var(--bg4)}
#graph{width:100%;height:100%}
.graph-hint{position:absolute;bottom:14px;left:16px;font-size:9px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
.graph-hint b{color:var(--teal)}
.week-label{position:absolute;top:14px;font:600 10px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--t3);pointer-events:none}
.mobile-btn{display:none;position:absolute;top:14px;left:14px;z-index:50;background:var(--bg2);border:1px solid var(--brd);color:var(--teal);padding:8px 12px;border-radius:5px;font:10px var(--mono);cursor:pointer}

/* Detail panel */
.detail{background:var(--bg2);border-left:1px solid var(--brd);overflow-y:auto;padding:0;transition:opacity .2s}
.detail::-webkit-scrollbar{width:4px}.detail::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:2px}
.detail.empty{display:flex;align-items:center;justify-content:center}
.detail .empty-msg{text-align:center;color:var(--t3);font-size:11px;line-height:1.8;padding:20px}
.detail .empty-msg b{color:var(--teal);display:block;margin-bottom:6px;font-size:12px}
.dh{padding:18px 16px;border-bottom:1px solid var(--brd);position:relative}
.dh-close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--t3);cursor:pointer;font-size:16px;line-height:1}
.dh-close:hover{color:var(--teal)}
.dh .badge{font-size:9px;padding:3px 8px;border-radius:3px;letter-spacing:.08em;text-transform:uppercase;display:inline-block;margin-bottom:8px;margin-right:4px;border:1px solid transparent}
.badge.w1{background:rgba(77,201,212,.12);color:var(--teal);border-color:var(--brd2)}
.badge.w2{background:rgba(167,139,250,.12);color:var(--purple);border-color:rgba(167,139,250,.3)}
.badge.w3{background:rgba(245,158,11,.12);color:var(--amber);border-color:rgba(245,158,11,.3)}
.badge.prework,.badge.intro{background:rgba(107,114,128,.15);color:var(--t2);border-color:rgba(107,114,128,.3)}
.badge.demo{background:rgba(236,72,153,.12);color:var(--pink);border-color:rgba(236,72,153,.3)}
.badge.done{background:rgba(34,197,94,.12);color:var(--green);border-color:rgba(34,197,94,.3)}
.badge.upc{background:rgba(59,130,246,.12);color:var(--blue);border-color:rgba(59,130,246,.3)}
.dh h2{font-family:var(--sans);font-size:17px;font-weight:600;line-height:1.3;margin-bottom:6px;padding-right:20px}
.dh .meta{font-size:10px;color:var(--t3);margin-top:4px}
.dh .meta span{color:var(--teal)}
.dh .avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--teal);margin:10px 0 6px;background:var(--bg3)}
.dh .desc{font-size:11px;color:var(--t2);line-height:1.55;margin-top:8px}
.speakers-row{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
.speakers-row .sp{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--brd);border-radius:20px;padding:3px 10px 3px 3px;font-size:10px;color:var(--t2);cursor:pointer;transition:all .15s}
.speakers-row .sp:hover{border-color:var(--teal);color:var(--text)}
.speakers-row .sp img{width:22px;height:22px;border-radius:50%;object-fit:cover;background:var(--bg4)}
.dvideo{padding:12px 16px;border-bottom:1px solid var(--brd)}
.dvideo iframe{width:100%;aspect-ratio:16/9;border-radius:6px;border:none;background:var(--bg4)}
.dsect{padding:14px 16px;border-bottom:1px solid var(--brd)}
.dsect:last-child{border-bottom:none}
.dsect h3{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:8px;font-weight:600}
.mat,.ci{font-size:10px;color:var(--t2);padding:4px 0;display:flex;align-items:center;gap:7px;cursor:pointer;transition:color .12s}
.mat::before{content:'◇';color:var(--amber);font-size:9px;flex-shrink:0}
.ci::before{content:'→';color:var(--teal);font-size:10px;flex-shrink:0;opacity:.6}
.ci:hover,.mat:hover{color:var(--text)}
.dlinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dlinks a{font-size:10px;padding:4px 10px;background:var(--td);border:1px solid var(--brd2);border-radius:4px;color:var(--teal);text-decoration:none;transition:all .15s}
.dlinks a:hover{background:var(--tg);border-color:var(--teal)}

/* Mobile */
@media (max-width:768px){
  .app{grid-template-columns:0 1fr 0;grid-template-rows:46px 1fr}
  .side{position:fixed;left:0;top:46px;bottom:0;width:260px;z-index:90;transform:translateX(-100%);transition:transform .22s}
  .side.show{transform:translateX(0)}
  .detail{position:fixed;right:0;top:46px;bottom:0;width:100%;max-width:340px;z-index:90;transform:translateX(100%);transition:transform .22s}
  .detail.show{transform:translateX(0)}
  .mobile-btn{display:block}
  .top-search{width:130px}
  .top-title{display:none}
}
</style>
</head>
<body>
<div class="app detail-closed">

  <div class="top">
    <div class="dots"><span class="r"></span><span class="y"></span><span class="g"></span></div>
    <span class="top-title">ainative-lab · <b>knowledge graph</b></span>
    <div class="top-right">
      <div class="view-toggle">
        <button id="view-graph" class="on">Graph</button>
        <button id="view-timeline">Timeline</button>
      </div>
      <input class="top-search" id="search" type="text" placeholder="Search...">
      <span class="top-badge">S2 Sprint</span>
    </div>
  </div>

  <div class="side" id="sidebar"></div>

  <div class="graph-area">
    <button class="mobile-btn" id="mobile-filter">☰ Filter</button>
    <div id="graph"></div>
    <div class="graph-hint"><b>Click</b> node · <b>Drag</b> pan · <b>Scroll</b> zoom</div>
  </div>

  <div class="detail empty" id="detail">
    <div class="empty-msg"><b>Click a node</b>to see session details,<br>speaker info, or linked concepts</div>
  </div>

</div>

<script>
(function(){
'use strict';

if(typeof ForceGraph==='undefined'||typeof d3==='undefined'){
  document.getElementById('graph').innerHTML='<div style="color:#ff6b6b;padding:40px;font-family:monospace">Libraries failed to load</div>';
  return;
}

const CUTOFF='2026-04-11';
const LMS='https://learn.aimindset.org/s2/workshops/';

// ═══════════ STATE ═══════════
const state={
  view:'graph',
  filters:{weeks:new Set(['prework','intro','w1','w2','w3','demo']),types:new Set(['session','speaker','concept']),status:new Set(['completed','upcoming'])},
  search:'',
  selected:null,
  data:null
};

// ═══════════ TYPE COLORS ═══════════
const TYPE={
  session:{c:'#4dc9d4',l:'Session',s:7},
  speaker:{c:'#a78bfa',l:'Speaker',s:6},
  concept:{c:'#22c55e',l:'Concept',s:5},
  resource:{c:'#fbbf24',l:'Resource',s:4}
};
const WEEKCOLOR={
  prework:'#6b7280',intro:'#6b7280',
  w1:'#4dc9d4',w2:'#a78bfa',w3:'#f59e0b',demo:'#ec4899'
};
const WEEK_LABEL={prework:'Prework',intro:'Intro',w1:'Week 1',w2:'Week 2',w3:'Week 3',demo:'Demo'};

// ═══════════ LOAD DATA ═══════════
fetch('data.json').then(r=>r.json()).then(raw=>{
  state.data=processData(raw);
  renderSidebar();
  buildGraph();
  bindEvents();
}).catch(err=>{
  document.getElementById('graph').innerHTML=
    '<div style="color:#ff6b6b;padding:40px;font-family:monospace">Failed to load data.json: '+err.message+'</div>';
});

function processData(raw){
  const speakers={}; raw.speakers.forEach(s=>speakers[s.id]=s);
  const sessions=raw.sessions.map(s=>({
    ...s,
    status:(s.date<CUTOFF?'completed':'upcoming'),
    speakerObjs:(s.speakers||[]).map(id=>speakers[id]).filter(Boolean)
  }));
  return {speakers:raw.speakers,sessions,concepts:raw.concepts,chains:raw.chains,meta:raw.meta,speakerMap:speakers};
}

// ═══════════ SIDEBAR ═══════════
function renderSidebar(){
  const sb=document.getElementById('sidebar');
  const weeks=[['prework','Prework'],['intro','Intro'],['w1','Week 1'],['w2','Week 2'],['w3','Week 3'],['demo','Demo Day']];
  const types=[['session','Sessions'],['speaker','Speakers'],['concept','Concepts']];
  const statuses=[['completed','Completed'],['upcoming','Upcoming']];
  let h='';
  h+='<div class="sh">Week</div>';
  weeks.forEach(([k,l])=>{
    const n=state.data.sessions.filter(s=>s.week===k).length;
    h+=`<div class="si ${state.filters.weeks.has(k)?'on':''}" data-f="weeks" data-v="${k}"><span class="chk"></span><span class="dot" style="background:${WEEKCOLOR[k]}"></span>${l}<span class="tag">${n}</span></div>`;
  });
  h+='<div class="sh">Type</div>';
  types.forEach(([k,l])=>{
    let n=0;
    if(k==='session')n=state.data.sessions.length;
    if(k==='speaker')n=state.data.speakers.length;
    if(k==='concept')n=state.data.concepts.length;
    h+=`<div class="si ${state.filters.types.has(k)?'on':''}" data-f="types" data-v="${k}"><span class="chk"></span><span class="dot" style="background:${TYPE[k].c}"></span>${l}<span class="tag">${n}</span></div>`;
  });
  h+='<div class="sh">Status</div>';
  statuses.forEach(([k,l])=>{
    const n=state.data.sessions.filter(s=>s.status===k).length;
    const dotColor=k==='completed'?'#22c55e':'#3b82f6';
    h+=`<div class="si ${state.filters.status.has(k)?'on':''}" data-f="status" data-v="${k}"><span class="chk"></span><span class="dot" style="background:${dotColor}"></span>${l}<span class="tag">${n}</span></div>`;
  });
  h+='<div class="sh">Legend</div><div class="legend">';
  h+='<span><i style="background:'+TYPE.session.c+'"></i>session</span>';
  h+='<span><i style="background:'+TYPE.speaker.c+'"></i>speaker</span>';
  h+='<span><i style="background:'+TYPE.concept.c+'"></i>concept</span>';
  h+='</div>';
  sb.innerHTML=h;
  sb.querySelectorAll('.si').forEach(el=>{
    el.addEventListener('click',()=>{
      const f=el.dataset.f,v=el.dataset.v;
      if(state.filters[f].has(v))state.filters[f].delete(v);
      else state.filters[f].add(v);
      el.classList.toggle('on');
      buildGraph();
    });
  });
}

// ═══════════ BUILD NODES/LINKS ═══════════
function buildGraphData(){
  const nodes=[],links=[];
  const {filters,search}=state;

  // Sessions
  const sessionsVisible=state.data.sessions.filter(s=>
    filters.weeks.has(s.week)&&filters.types.has('session')&&filters.status.has(s.status)&&
    (!search||matchSearch(s.title,search)||matchSearch(s.id,search))
  );
  sessionsVisible.forEach(s=>{
    nodes.push({
      id:s.id,type:'session',week:s.week,status:s.status,
      name:s.title,date:s.date,duration:s.duration,
      track:s.track,raw:s,
      val:s.track==='lecture'?12:s.track==='demo'?14:6
    });
  });

  // Speakers (only those connected to visible sessions)
  if(filters.types.has('speaker')){
    const speakerIds=new Set();
    sessionsVisible.forEach(s=>s.speakerObjs.forEach(sp=>speakerIds.add(sp.id)));
    const searchedSpeakers=search?state.data.speakers.filter(sp=>matchSearch(sp.name,search)||matchSearch(sp.short||'',search)):[];
    searchedSpeakers.forEach(sp=>speakerIds.add(sp.id));
    speakerIds.forEach(id=>{
      const sp=state.data.speakerMap[id];
      if(!sp)return;
      nodes.push({id:sp.id,type:'speaker',name:sp.short||sp.name,raw:sp,val:5});
    });
    sessionsVisible.forEach(s=>{
      s.speakerObjs.forEach(sp=>{
        if(speakerIds.has(sp.id))links.push({source:sp.id,target:s.id,kind:'hosts',w:1});
      });
    });
  }

  // Concepts
  if(filters.types.has('concept')){
    const sessIds=new Set(sessionsVisible.map(s=>s.id));
    state.data.concepts.forEach(c=>{
      const linked=c.sessions.filter(sid=>sessIds.has(sid));
      if(linked.length===0&&!(search&&matchSearch(c.name,search)))return;
      nodes.push({id:c.id,type:'concept',name:c.name,raw:c,val:4});
      linked.forEach(sid=>links.push({source:c.id,target:sid,kind:'discusses',w:.6}));
    });
  }

  // Chains — thicker links
  const nodeSet=new Set(nodes.map(n=>n.id));
  state.data.chains.forEach(ch=>{
    for(let i=0;i<ch.sessions.length-1;i++){
      const a=ch.sessions[i],b=ch.sessions[i+1];
      if(nodeSet.has(a)&&nodeSet.has(b))links.push({source:a,target:b,kind:'chain',chain:ch.id,w:2.5});
    }
  });

  return {nodes,links};
}
function matchSearch(v,q){return (v||'').toLowerCase().includes(q.toLowerCase())}

// ═══════════ BUILD GRAPH ═══════════
let graph=null;
function buildGraph(){
  const gData=buildGraphData();
  const el=document.getElementById('graph');
  el.innerHTML='';
  // clear any week labels
  document.querySelectorAll('.week-label').forEach(n=>n.remove());

  graph=ForceGraph()(el)
    .graphData(gData)
    .backgroundColor('#0a0e14')
    .nodeRelSize(4)
    .nodeVal(n=>n.val||5)
    .linkColor(l=>l.kind==='chain'?'rgba(77,201,212,.55)':l.kind==='hosts'?'rgba(167,139,250,.28)':'rgba(34,197,94,.22)')
    .linkWidth(l=>l.w||1)
    .linkDirectionalParticles(l=>l.kind==='chain'?2:0)
    .linkDirectionalParticleSpeed(.006)
    .linkDirectionalParticleWidth(2)
    .nodeCanvasObjectMode(()=>'replace')
    .nodeCanvasObject((node,ctx,scale)=>drawNode(node,ctx,scale))
    .nodePointerAreaPaint((node,color,ctx)=>{
      ctx.fillStyle=color;
      const r=Math.sqrt(node.val||5)*4;
      ctx.beginPath();ctx.arc(node.x,node.y,r,0,2*Math.PI);ctx.fill();
    })
    .onNodeClick(node=>{openDetail(node);focusNode(node)})
    .onNodeHover(n=>{el.style.cursor=n?'pointer':'grab'})
    .cooldownTicks(state.view==='graph'?100:0)
    .d3AlphaDecay(.028)
    .d3VelocityDecay(.35);

  if(state.view==='graph'){
    applyGraphForces();
  }else{
    applyTimelineLayout(gData);
  }

  setTimeout(()=>graph.zoomToFit(400,60),state.view==='timeline'?50:800);
}

function drawNode(node,ctx,scale){
  const r=Math.sqrt(node.val||5)*4;
  const color=TYPE[node.type]?.c||'#888';
  const selected=state.selected&&state.selected.id===node.id;

  // halo for lectures / demo
  if(node.type==='session'&&(node.track==='lecture'||node.track==='demo')){
    ctx.beginPath();ctx.arc(node.x,node.y,r+6,0,2*Math.PI);
    ctx.fillStyle=WEEKCOLOR[node.week]+'22';ctx.fill();
  }

  // speaker: photo
  if(node.type==='speaker'&&node.raw?.photo){
    drawSpeakerImg(node,ctx,r);
  }else{
    ctx.beginPath();ctx.arc(node.x,node.y,r,0,2*Math.PI);
    ctx.fillStyle=node.type==='session'?WEEKCOLOR[node.week]||color:color;
    if(node.type==='session'&&node.status==='upcoming'){
      ctx.globalAlpha=.45;ctx.fill();ctx.globalAlpha=1;
      ctx.strokeStyle=WEEKCOLOR[node.week]||color;ctx.lineWidth=1.2;ctx.stroke();
    }else{
      ctx.fill();
    }
  }

  if(selected){
    ctx.beginPath();ctx.arc(node.x,node.y,r+4,0,2*Math.PI);
    ctx.strokeStyle='#4dc9d4';ctx.lineWidth=2;ctx.stroke();
  }

  // label
  if(scale>.7||node.type==='session'&&(node.track==='lecture'||node.track==='demo')){
    const fs=Math.max(3,11/scale);
    ctx.font=`500 ${fs}px 'IBM Plex Mono',monospace`;
    ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillStyle='rgba(230,237,243,.85)';
    const label=(node.name||'').length>34?node.name.slice(0,32)+'…':node.name;
    ctx.fillText(label,node.x,node.y+r+3);
  }
}

const imgCache={};
function drawSpeakerImg(node,ctx,r){
  const photo=node.raw.photo;
  if(!imgCache[photo]){
    const img=new Image();img.src='speakers/'+photo;
    imgCache[photo]={img,loaded:false};
    img.onload=()=>{imgCache[photo].loaded=true;try{graph&&graph.d3ReheatSimulation&&graph.d3ReheatSimulation()}catch(e){}};
    img.onerror=()=>{imgCache[photo].error=true};
  }
  const entry=imgCache[photo];
  if(entry.loaded){
    ctx.save();
    ctx.beginPath();ctx.arc(node.x,node.y,r,0,2*Math.PI);ctx.closePath();ctx.clip();
    ctx.drawImage(entry.img,node.x-r,node.y-r,r*2,r*2);
    ctx.restore();
    ctx.beginPath();ctx.arc(node.x,node.y,r,0,2*Math.PI);
    ctx.strokeStyle='#a78bfa';ctx.lineWidth=1.4;ctx.stroke();
  }else{
    ctx.beginPath();ctx.arc(node.x,node.y,r,0,2*Math.PI);
    ctx.fillStyle='#a78bfa';ctx.fill();
  }
}

// ═══════════ GRAPH MODE: clustered by week ═══════════
function applyGraphForces(){
  const el=document.getElementById('graph');
  const W=el.clientWidth,H=el.clientHeight;
  const weekX={prework:W*.5,intro:W*.5,w1:W*.22,w2:W*.5,w3:W*.78,demo:W*.5};
  const weekY={prework:H*.12,intro:H*.22,w1:H*.5,w2:H*.5,w3:H*.5,demo:H*.88};

  graph
    .d3Force('charge').strength(-120);
  graph
    .d3Force('center',null)
    .d3Force('x',d3.forceX(n=>{
      if(n.type==='session')return weekX[n.week]||W/2;
      if(n.type==='speaker'){
        const avg=avgSessionX(n,weekX);return avg;
      }
      return W/2;
    }).strength(.24))
    .d3Force('y',d3.forceY(n=>{
      if(n.type==='session')return weekY[n.week]||H/2;
      if(n.type==='speaker'){
        const avg=avgSessionY(n,weekY);return avg-60;
      }
      return H/2+80;
    }).strength(.22))
    .d3Force('collide',d3.forceCollide(n=>Math.sqrt(n.val||5)*5+4));
  graph.d3ReheatSimulation();
  drawWeekLabels(weekX,weekY);
}
function avgSessionX(speakerNode,weekX){
  const sessIds=state.data.sessions.filter(s=>s.speakers&&s.speakers.includes(speakerNode.id)).map(s=>s.week);
  if(!sessIds.length)return document.getElementById('graph').clientWidth/2;
  const sum=sessIds.reduce((a,w)=>a+(weekX[w]||0),0);
  return sum/sessIds.length;
}
function avgSessionY(speakerNode,weekY){
  const sessIds=state.data.sessions.filter(s=>s.speakers&&s.speakers.includes(speakerNode.id)).map(s=>s.week);
  if(!sessIds.length)return document.getElementById('graph').clientHeight/2;
  const sum=sessIds.reduce((a,w)=>a+(weekY[w]||0),0);
  return sum/sessIds.length;
}
function drawWeekLabels(weekX,weekY){
  const ga=document.querySelector('.graph-area');
  [['w1','Week 1',weekX.w1],['w2','Week 2',weekX.w2],['w3','Week 3',weekX.w3]].forEach(([k,l,x])=>{
    const d=document.createElement('div');
    d.className='week-label';
    d.textContent=l;
    d.style.left=(x-24)+'px';
    d.style.color=WEEKCOLOR[k];
    ga.appendChild(d);
  });
}

// ═══════════ TIMELINE MODE ═══════════
function applyTimelineLayout(gData){
  const el=document.getElementById('graph');
  const W=el.clientWidth,H=el.clientHeight;
  const pad=80;
  const sessions=gData.nodes.filter(n=>n.type==='session');
  if(!sessions.length)return;
  const dates=sessions.map(s=>new Date(s.date));
  const dmin=new Date(Math.min(...dates)),dmax=new Date(Math.max(...dates));
  const xScale=d3.scaleTime().domain([dmin,dmax]).range([pad,W-pad]);
  // tracks as lanes
  const tracks=['prework','intro','lecture','workshop','founder','demo'];
  const laneH=(H-100)/tracks.length;
  const laneY={};tracks.forEach((t,i)=>laneY[t]=70+laneH*(i+.5));

  gData.nodes.forEach(n=>{
    if(n.type==='session'){
      n.fx=xScale(new Date(n.date));
      n.fy=laneY[n.track]||H/2;
    }else if(n.type==='speaker'){
      // position near their first session
      const sess=state.data.sessions.find(s=>s.speakers&&s.speakers.includes(n.id)&&n.type==='speaker');
      if(sess){n.fx=xScale(new Date(sess.date));n.fy=(laneY[sess.track]||H/2)-36}
      else{n.fx=pad;n.fy=H-40}
    }else{
      n.fx=W-pad;n.fy=40;
    }
  });

  graph.d3Force('charge',null).d3Force('center',null).d3Force('x',null).d3Force('y',null).d3Force('collide',null);
  graph.d3ReheatSimulation();

  // draw lane labels
  const ga=document.querySelector('.graph-area');
  tracks.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='week-label';
    d.textContent=t.toUpperCase();
    d.style.top=(60+laneH*(i+.5)-6)+'px';
    d.style.left='12px';
    d.style.color='rgba(230,237,243,.35)';
    ga.appendChild(d);
  });
}

function focusNode(node){
  if(!node||node.x==null)return;
  graph.centerAt(node.x,node.y,700);
  graph.zoom(2.2,700);
}

// ═══════════ DETAIL PANEL ═══════════
function openDetail(node){
  state.selected=node;
  const det=document.getElementById('detail');
  document.querySelector('.app').classList.remove('detail-closed');
  det.classList.remove('empty');
  det.classList.add('show');
  if(node.type==='session')det.innerHTML=renderSession(node);
  else if(node.type==='speaker')det.innerHTML=renderSpeaker(node);
  else if(node.type==='concept')det.innerHTML=renderConcept(node);
  det.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click',()=>{
      const id=el.dataset.nav;
      const gd=graph.graphData();
      const tgt=gd.nodes.find(n=>n.id===id);
      if(tgt){openDetail(tgt);focusNode(tgt)}
    });
  });
  const closeBtn=det.querySelector('.dh-close');
  if(closeBtn)closeBtn.addEventListener('click',closeDetail);
}
function closeDetail(){
  state.selected=null;
  const det=document.getElementById('detail');
  det.classList.add('empty');
  det.classList.remove('show');
  det.innerHTML='<div class="empty-msg"><b>Click a node</b>to see session details,<br>speaker info, or linked concepts</div>';
  if(window.innerWidth>768)document.querySelector('.app').classList.add('detail-closed');
}
function renderSession(node){
  const s=node.raw;
  const status=node.status==='completed'?'<span class="badge done">Completed</span>':'<span class="badge upc">Upcoming</span>';
  const week=`<span class="badge ${s.week}">${WEEK_LABEL[s.week]||s.week}</span>`;
  const date=formatDate(s.date);
  const speakers=(s.speakerObjs||[]).map(sp=>`<div class="sp" data-nav="${sp.id}"><img src="speakers/${sp.photo}" loading="lazy" onerror="this.style.display='none'"><span>${sp.short||sp.name}</span></div>`).join('');
  const video=s.video?`<div class="dvideo"><iframe src="https://www.youtube.com/embed/${s.video}" allowfullscreen loading="lazy"></iframe></div>`:'';
  const mats=(s.materials&&s.materials.length)?`<div class="dsect"><h3>Materials</h3>${s.materials.map(m=>`<div class="mat">${m}</div>`).join('')}</div>`:'';
  // related concepts
  const concepts=state.data.concepts.filter(c=>c.sessions.includes(s.id));
  const conceptsBlock=concepts.length?`<div class="dsect"><h3>Concepts</h3>${concepts.map(c=>`<div class="ci" data-nav="${c.id}">${c.name}</div>`).join('')}</div>`:'';
  const lmsUrl=LMS+s.id;
  return `
    <div class="dh">
      <button class="dh-close">×</button>
      ${week}${status}
      <h2>${s.title}</h2>
      <div class="meta"><span>${date}</span>${s.duration?' · '+s.duration:''}${s.track?' · '+s.track:''}</div>
      ${speakers?'<div class="speakers-row">'+speakers+'</div>':''}
      <div class="dlinks"><a href="${lmsUrl}" target="_blank">Open in LMS ↗</a></div>
    </div>
    ${video}
    ${mats}
    ${conceptsBlock}
  `;
}
function renderSpeaker(node){
  const sp=node.raw;
  const sessions=state.data.sessions.filter(s=>s.speakers&&s.speakers.includes(sp.id));
  const sessList=sessions.map(s=>`<div class="ci" data-nav="${s.id}">${s.title}</div>`).join('');
  const photo=sp.photo?`<img class="avatar" src="speakers/${sp.photo}" loading="lazy" onerror="this.style.display='none'">`:'';
  return `
    <div class="dh">
      <button class="dh-close">×</button>
      <span class="badge w1">Speaker</span>
      ${photo}
      <h2>${sp.name}</h2>
      <div class="meta">${sp.affiliation||''}</div>
    </div>
    <div class="dsect"><h3>Sessions (${sessions.length})</h3>${sessList}</div>
  `;
}
function renderConcept(node){
  const c=node.raw;
  const sessions=state.data.sessions.filter(s=>c.sessions.includes(s.id));
  const list=sessions.map(s=>`<div class="ci" data-nav="${s.id}">${s.title}</div>`).join('');
  return `
    <div class="dh">
      <button class="dh-close">×</button>
      <span class="badge w2">Concept</span>
      <h2>${c.name}</h2>
      <div class="desc">${c.desc||''}</div>
    </div>
    <div class="dsect"><h3>Linked sessions</h3>${list}</div>
  `;
}
function formatDate(iso){
  try{
    const d=new Date(iso);
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  }catch(e){return iso}
}

// ═══════════ EVENTS ═══════════
function bindEvents(){
  document.getElementById('view-graph').addEventListener('click',()=>setView('graph'));
  document.getElementById('view-timeline').addEventListener('click',()=>setView('timeline'));
  document.getElementById('search').addEventListener('input',e=>{
    state.search=e.target.value.trim();
    buildGraph();
  });
  document.getElementById('mobile-filter').addEventListener('click',()=>{
    document.querySelector('.side').classList.toggle('show');
  });
  window.addEventListener('resize',()=>{
    if(graph){
      const el=document.getElementById('graph');
      graph.width(el.clientWidth).height(el.clientHeight);
      if(state.view==='graph')applyGraphForces();
      else buildGraph();
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')closeDetail();
    if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();document.getElementById('search').focus()}
  });
}
function setView(v){
  state.view=v;
  document.getElementById('view-graph').classList.toggle('on',v==='graph');
  document.getElementById('view-timeline').classList.toggle('on',v==='timeline');
  // Unfreeze any fixed positions
  if(graph){
    graph.graphData().nodes.forEach(n=>{n.fx=null;n.fy=null});
  }
  buildGraph();
}

})();
</script>
